# /etc/nginx/conf.d/fleetdesk.conf — Fleet Desk frontend on RHEL 10
# Static files from /var/www/fleetdesk. /api/ is proxied to the backend once it exists.

server {
    listen 80;
    server_name fleet.example.local;          # change to your hostname
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name fleet.example.local;          # change to your hostname

    ssl_certificate     /etc/pki/tls/certs/fleetdesk.crt;
    ssl_certificate_key /etc/pki/tls/private/fleetdesk.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root  /var/www/fleetdesk;
    index index.html;

    # Security headers. The app loads nothing from outside its own origin.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Backend. Uncomment once the API is reachable — run it with `docker compose up -d`
    # (then point proxy_pass at the published API port) or as a systemd service.
    # Remember to set the fleetdesk-mode meta tag in index.html to "api".
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     client_max_body_size 2m;
    # }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/fleetdesk_access.log;
    error_log  /var/log/nginx/fleetdesk_error.log warn;
}
